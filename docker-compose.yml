version: "3.8"

services:

  postgres:
    image: postgres:17.4-alpine
    container_name: news_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./news_system/postgres_data:/var/lib/postgresql/data
  #    healthcheck:
  #      test: [ "CMD-SHELL", "pg_isready -U postgres -d news_db" ]
  #      interval: 10s
  #      timeout: 5s
  #      retries: 5
  #    networks:
  #      - app_network


  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    container_name: news_broker
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
